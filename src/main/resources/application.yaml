spring:
  application:
    name: inventory-billing-system
  config:
    # Local secrets (git-ignored); see .env.example.
    import: optional:file:.env[.properties]
  docker:
    compose:
      # Keep PostgreSQL running between restarts for faster dev cycles.
      lifecycle-management: start-only
  datasource:
    hikari:
      # Fail fast (SQLSTATE 55P03) instead of holding a pool connection on a locked row.
      connection-init-sql: "SET lock_timeout = '5s'"
  flyway:
    postgresql:
      # Session advisory lock instead of a transactional one: that keeps a transaction open while
      # migrating, and CREATE INDEX CONCURRENTLY (non-transactional migrations) would wait for it forever.
      transactional-lock: false
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate
    # Prevent hidden lazy queries during response serialization.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      # Reject 2.5 for integer fields such as quantity instead of truncating it to 2.
      accept-float-as-int: false
  data:
    web:
      pageable:
        serialization-mode: via-dto
        max-page-size: 100
  servlet:
    multipart:
      # Product images; larger uploads get 413 before reaching the controller.
      max-file-size: 5MB
      max-request-size: 6MB
  # SMTP for password reset codes and account notices; without a host, neither is emailed (see app.email).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

management:
  health:
    mail:
      # A missing or slow SMTP server must not mark the API as down (Render restarts it).
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # Sign in again this long after logging in, however often the session refreshed.
    max-session-age: ${JWT_MAX_SESSION_AGE:7d}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    # Comma-separated; the Vite dev server by default.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  store:
    # Calendar days in reports ("sales on Oct 1") follow the store's local time.
    time-zone: America/Mexico_City
  cash-drawer:
    # Pesos either way; the web's Supervision alerts on closed drawers off by at least this much.
    unbalanced-threshold: ${CASH_DRAWER_UNBALANCED_THRESHOLD:50.00}
  password-reset:
    code-ttl: 10m
    max-attempts: 5
    resend-cooldown: 60s
    max-codes-per-hour: 5
    # Local development: with no email/SMS provider, codes go to the log. Off in production.
    log-codes: true
  email:
    from: ${MAIL_FROM:}
    # The web client, for the buttons in the emails; the Vite dev server by default.
    app-url: ${EMAIL_APP_URL:http://localhost:5173}
  # Per client address (in memory, one instance): a burst of `capacity`, then one request per
  # `refill-period`. Independent of the per-account password reset limits above.
  rate-limit:
    login:
      capacity: 10
      refill-period: 6s
    password-reset-code:
      # Each code may be an SMS (paid): about 12 an hour per address.
      capacity: 5
      refill-period: 5m
    password-reset:
      capacity: 10
      refill-period: 1m
  sms:
    # Without an account SID, codes aren't sent by SMS.
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  images:
    # Local development: files under local.dir, served by this API at /images/**.
    local:
      enabled: true
      dir: uploads/images
      base-url: ${IMAGES_BASE_URL:http://localhost:8080/images}
    # Production: with a cloud name, images go to Cloudinary instead.
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
