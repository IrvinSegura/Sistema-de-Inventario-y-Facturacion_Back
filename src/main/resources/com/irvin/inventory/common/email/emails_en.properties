account-created.subject=Your Inventory Billing account is ready
account-created.preheader=An admin added you. Sign in with this email.
account-created.title=Welcome aboard
account-created.kicker=New account
account-created.body=An admin created your Inventory Billing account. Sign in with this email and the password they gave you.
account-created.body.2=Once in, change that password from your account to one only you know.
account-created.callout-title=Weren't expecting this account?
account-created.callout=Let the store's admin know.

role-changed.subject=Your Inventory Billing role changed
role-changed.preheader=An admin changed what you can see and do.
role-changed.title=Your role changed
role-changed.kicker=Account change
role-changed.body=An admin changed your role, and with it what you can see and do in the app.
role-changed.body.2=For your security, your sessions were signed out: sign in again to keep working.
role-changed.callout-title=Weren't expecting this change?
role-changed.callout=Let the store's admin know.

account-deactivated.subject=Your account was deactivated
account-deactivated.preheader=You can no longer sign in to Inventory Billing.
account-deactivated.title=Your account was deactivated
account-deactivated.kicker=Account change
account-deactivated.body=An admin deactivated your account, so you can no longer sign in and your sessions were signed out.
account-deactivated.callout-title=Think it's a mistake?
account-deactivated.callout=Talk to the store's admin.

account-reactivated.subject=Your account was reactivated
account-reactivated.preheader=You can sign in again.
account-reactivated.title=Your account is active again
account-reactivated.kicker=Account change
account-reactivated.body=An admin activated your account again. You can sign in with your email and your password.
account-reactivated.callout-title=Weren't expecting this change?
account-reactivated.callout=Let the store's admin know.

password-changed.subject=Your password changed
password-changed.preheader=It was changed from your account and your other sessions were signed out.
password-changed.title=Your password changed
password-changed.kicker=Security notice
password-changed.body=Your account's password was changed from the app and your other sessions were signed out.
password-changed.callout-title=Wasn't you?
password-changed.callout=Ask the store's admin to reset your password right away.

password-recovered.subject=You reset your password
password-recovered.preheader=A code was used to choose a new password.
password-recovered.title=You reset your password
password-recovered.kicker=Security notice
password-recovered.body=A new password was chosen with a code sent to your email or your phone, and all your sessions were signed out.
password-recovered.callout-title=Wasn't you?
password-recovered.callout=Ask the store's admin to reset your password right away.

sale-cancelled.subject=Sale #{number} was cancelled
sale-cancelled.preheader={actor} cancelled a sale you made.
sale-cancelled.title=One of your sales was cancelled
sale-cancelled.kicker=Sale cancelled
sale-cancelled.body={actor} cancelled sale #{number}, which you made.
sale-cancelled.callout-title=Any questions?
sale-cancelled.callout=Talk to whoever cancelled it or to the store's admin.

purchase-cancelled.subject=A purchase from {supplier} was cancelled
purchase-cancelled.preheader={actor} cancelled a purchase from {supplier}.
purchase-cancelled.title=A purchase was cancelled
purchase-cancelled.kicker=Purchase cancelled
purchase-cancelled.body={actor} cancelled the purchase from {supplier}.
purchase-cancelled.callout-title=Weren't expecting this cancellation?
purchase-cancelled.callout=Check the purchase in the app or talk to whoever cancelled it.

cash-drawer-assigned.subject=You were assigned to a cash drawer
cash-drawer-assigned.preheader={actor} added you to {responsible}'s cash drawer.
cash-drawer-assigned.title=You were assigned to a cash drawer
cash-drawer-assigned.kicker=Cash drawer assigned
cash-drawer-assigned.body={actor} opened a cash drawer with {responsible} as responsible and added you to sell from it.
cash-drawer-assigned.callout-title=Weren't expecting this?
cash-drawer-assigned.callout=Let the store's admin know.

cash-drawer-closed.subject=Your cash drawer for {date} was closed
cash-drawer-closed.preheader=The cash counted matched the expected amount.
cash-drawer-closed.title=Your cash drawer was closed
cash-drawer-closed.kicker=Cash count
cash-drawer-closed.body={actor} closed the cash drawer for {date} that you were responsible for.
cash-drawer-closed.body.2=The cash counted matched the expected amount.
cash-drawer-closed.callout-title=Any questions?
cash-drawer-closed.callout=Check the count in the cash drawer history or talk to whoever closed it.

cash-drawer-closed-off.subject=Your cash drawer for {date} was closed with a difference
cash-drawer-closed-off.preheader=The cash counted didn't match the expected amount.
cash-drawer-closed-off.title=Your cash drawer was closed with a difference
cash-drawer-closed-off.kicker=Cash count
cash-drawer-closed-off.body={actor} closed the cash drawer for {date} that you were responsible for.
cash-drawer-closed-off.body.2=The cash counted didn't match the expected amount: a surplus shows with a + sign, a shortage with a - sign.
cash-drawer-closed-off.callout-title=Check the count
cash-drawer-closed-off.callout=Compare the details in the cash drawer history and talk to whoever closed it.
