# Production (container): every value comes from env vars, documented in the README.
server:
  # Render injects PORT; 8080 elsewhere.
  port: ${PORT:8080}
  # Behind a TLS-terminating proxy: honor X-Forwarded-* so generated URLs (Swagger) use https.
  # Native (Tomcat RemoteIpValve), not framework: Render appends to X-Forwarded-For without clearing
  # what the client sent, so the client address is the rightmost non-private entry, not the leftmost
  # (which the rate limits would otherwise trust). Headers count only from private-network proxies.
  forward-headers-strategy: native

spring:
  datasource:
    # Separate parts because hosting providers expose them that way (not as a JDBC URL).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  cors:
    # The deployed web client(s); none until it is set.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  password-reset:
    # Reset codes are secrets: never in production logs.
    log-codes: false
  email:
    # The deployed web client; without it, emails go out with no button.
    app-url: ${EMAIL_APP_URL:}
  images:
    local:
      # Render's disk is wiped on every deploy: without Cloudinary, uploads answer 503.
      enabled: false

# Public on purpose: the API docs are part of the portfolio demo (endpoints still require a token).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
